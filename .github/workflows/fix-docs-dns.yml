# Point docs.pcln.top at Cloudflare Pages (pcln-docs), not GitHub Pages.
name: Fix Docs DNS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-dns:
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    steps:
      - name: Update DNS and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="${CLOUDFLARE_API_TOKEN}"
          AUTH="Authorization: Bearer ${TOKEN}"

          zjson=$(curl -sS -H "$AUTH" "https://api.cloudflare.com/client/v4/zones?name=pcln.top")
          echo "$zjson" | head -c 600; echo
          ZONE=$(echo "$zjson" | python3 -c 'import sys,json; r=json.load(sys.stdin).get("result") or []; print(r[0]["id"] if r else "")')
          test -n "$ZONE"
          echo "Zone=$ZONE"

          rjson=$(curl -sS -H "$AUTH" "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records?name=docs.pcln.top")
          echo "Existing:"; echo "$rjson" | head -c 1200; echo

          # Delete all docs.pcln.top records (A/AAAA/CNAME)
          echo "$rjson" | python3 -c 'import sys,json; [print(x["id"]) for x in (json.load(sys.stdin).get("result") or [])]' | while read -r rid; do
            echo "DELETE $rid"
            curl -sS -X DELETE -H "$AUTH" "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records/${rid}" | head -c 300
            echo
          done

          create=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records" \
            --data '{"type":"CNAME","name":"docs","content":"pcln-docs.pages.dev","proxied":true,"ttl":1}')
          echo "Create:"; echo "$create" | head -c 800; echo

          domains=$(curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/pcln-docs/domains")
          echo "Pages domains:"; echo "$domains" | head -c 1200; echo

          sleep 8
          echo "--- pcln-docs.pages.dev ---"
          curl -sSI --max-time 30 "https://pcln-docs.pages.dev/" | head -n 20 || true
          echo "--- docs.pcln.top ---"
          curl -sSI --max-time 30 "https://docs.pcln.top/" | head -n 25 || true

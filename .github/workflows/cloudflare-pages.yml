name: Deploy Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets live on the GitHub Environment (not only repo secrets):
    # Settings → Environments → cloudflare-pages → Environment secrets
    #   CLOUDFLARE_API_TOKEN
    #   CLOUDFLARE_ACCOUNT_ID
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: |
          if [ -n "${{ vars.VITE_SUPABASE_URL }}" ]; then
            export VITE_SUPABASE_URL='${{ vars.VITE_SUPABASE_URL }}'
          fi
          if [ -n "${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            export VITE_SUPABASE_PUBLISHABLE_KEY='${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}'
          fi
          if [ -n "${{ vars.VITE_WEB_BASE_API }}" ]; then
            export VITE_WEB_BASE_API='${{ vars.VITE_WEB_BASE_API }}'
          fi
          pnpm build:prod

      - name: Verify SPA hosting files
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test -f dist/login/index.html
          test -f dist/auth/callback/index.html
          echo "Cloudflare Pages artifact OK"
          ls -la dist | head -n 40

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID."
            echo "Add them as Environment secrets on the 'cloudflare-pages' environment:"
            echo "  Settings → Environments → cloudflare-pages → Environment secrets"
            echo "(Repository secrets also work if the job can read them.)"
            exit 1
          fi
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          code=$(curl -sS -o /tmp/cf-pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects?per_page=5" || true)
          echo "Pages projects API HTTP ${code}"
          head -c 1200 /tmp/cf-pages.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Token is present but Cloudflare Pages API returned HTTP ${code} (often auth 10000)."
            echo "Recreate an Account API Token (not Zone token) with:"
            echo "  Account → Cloudflare Pages → Edit"
            echo "  Account → Account Settings → Read"
            echo "  User → User Details → Read"
            echo "  User → Memberships → Read"
            echo "Account Resources: Include → your account"
            echo "https://dash.cloudflare.com/profile/api-tokens"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PROJECT=pcl-n-web
          npx --yes wrangler@4 whoami || true
          # Create the Pages project on first deploy (wrangler does not always auto-create).
          if ! npx --yes wrangler@4 pages project list 2>/dev/null | grep -F "$PROJECT" >/dev/null; then
            echo "Creating Pages project: $PROJECT"
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=master
          fi
          # Deploy to the production branch so custom domains serve this build.
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PROJECT" \
            --branch=master \
            --commit-dirty=true

          # Bind apex + auth domains to this project (idempotent).
          # Without this, DNS may still proxy the old GitHub Pages origin.
          for domain in pcln.top www.pcln.top auth.pcln.top; do
            echo "Ensuring custom domain: $domain"
            code=$(curl -sS -o /tmp/cf-domain.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/domains" \
              --data "{\"name\":\"${domain}\"}" || true)
            echo "domain ${domain} HTTP ${code}"
            head -c 400 /tmp/cf-domain.json || true
            echo
            # 200/201 created; 409 already exists — both OK
            if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "409" ]; then
              # Some accounts return 400 with success:false when already attached
              if grep -qiE 'already|exists|taken' /tmp/cf-domain.json 2>/dev/null; then
                echo "Domain ${domain} already attached."
              else
                echo "::warning::Could not attach ${domain} (HTTP ${code}). Add it manually in Pages → Custom domains."
              fi
            fi
          done

          echo "deployment-url=https://pcln.top" >> "$GITHUB_OUTPUT"
          echo "preview-url=https://${PROJECT}.pages.dev" >> "$GITHUB_OUTPUT"

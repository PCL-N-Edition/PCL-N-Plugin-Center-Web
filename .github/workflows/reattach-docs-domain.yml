name: Reattach Docs Domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reattach:
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    steps:
      - name: Reattach docs.pcln.top and inspect token permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          T="$CLOUDFLARE_API_TOKEN"
          A="$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $T"
          P=pcln-docs
          D=docs.pcln.top

          echo "=== token verify ==="
          curl -sS -H "$AUTH" "https://api.cloudflare.com/client/v4/user/tokens/verify" | head -c 500; echo

          echo "=== delete domain (if any) ==="
          curl -sS -X DELETE -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/$P/domains/$D" | head -c 400; echo

          sleep 2
          echo "=== re-add domain ==="
          curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/$P/domains" \
            --data "{\"name\":\"$D\"}" | head -c 800; echo

          sleep 3
          echo "=== domain status ==="
          curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/$P/domains" | head -c 1500; echo

          echo "=== zone dns list (needs Zone.DNS) ==="
          Z=445dcc77acd395b2460d97c176fa3215
          curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/zones/$Z/dns_records?name=$D" | head -c 800; echo

          echo "=== try create CNAME ==="
          curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$Z/dns_records" \
            --data '{"type":"CNAME","name":"docs","content":"pcln-docs.pages.dev","proxied":true,"ttl":1}' | head -c 800; echo

          echo "=== smoke ==="
          curl -sSI --max-time 20 "https://pcln-docs.pages.dev/" | head -n 15 || true
          curl -sSI --max-time 20 "https://docs.pcln.top/" | head -n 15 || true
